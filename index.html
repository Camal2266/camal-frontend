<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Camal Data</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f5f6;
  color:#17221d;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

.container{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:18px;
}

.header{
  background:#087f5b;
  color:white;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  margin:15px 0;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2,h3{
  margin-bottom:15px;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
}

input:focus,select:focus{
  border-color:#087f5b;
}

.btn{
  width:100%;
  padding:13px;
  border-radius:9px;
  background:#087f5b;
  color:white;
  font-weight:bold;
  margin-top:8px;
}

.btn.secondary{
  background:#555;
}

.btn.danger{
  background:#c62828;
}

.btn.warning{
  background:#e68a00;
}

.btn.small{
  width:auto;
  padding:8px 12px;
  margin:3px;
}

.tabs{
  display:flex;
  gap:8px;
  margin:15px 0;
}

.tab{
  flex:1;
  padding:12px 5px;
  border-radius:9px;
  background:#ddd;
}

.tab.active{
  background:#087f5b;
  color:white;
}

.balance{
  background:linear-gradient(135deg,#087f5b,#0ca678);
  color:white;
  border-radius:16px;
  padding:22px;
  margin-bottom:15px;
}

.balance small{
  opacity:.9;
}

.balance strong{
  display:block;
  font-size:30px;
  margin-top:8px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option{
  background:#f1f3f5;
  padding:15px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
}

.option b{
  display:block;
  margin-top:6px;
}

.item{
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.item:last-child{
  border-bottom:0;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e7f5ee;
  color:#087f5b;
  font-size:12px;
}

.badge.red{
  background:#ffebee;
  color:#c62828;
}

.badge.orange{
  background:#fff3e0;
  color:#e68a00;
}

.price{
  color:#087f5b;
  font-weight:bold;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.logout{
  background:#c62828;
  color:white;
  padding:8px 12px;
  border-radius:8px;
}

.message{
  padding:11px;
  border-radius:9px;
  margin:10px 0;
  background:#e7f5ee;
  color:#087f5b;
}

.message.error{
  background:#ffebee;
  color:#c62828;
}

.admin-nav{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:12px;
}

.admin-nav button{
  white-space:nowrap;
  padding:10px;
  border-radius:8px;
  background:#ddd;
}

.admin-nav button.active{
  background:#087f5b;
  color:white;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  padding:9px 5px;
  border-bottom:1px solid #eee;
  text-align:left;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal-box{
  background:white;
  width:100%;
  max-width:450px;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:20px;
}

.close{
  float:right;
  background:#eee;
  border-radius:50%;
  width:32px;
  height:32px;
}

.footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<div class="header">
  Camal Data
</div>

<div class="container">

<!-- AUTH -->
<section id="authPage">

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="showLogin()">Login</button>
      <button class="tab" id="registerTab" onclick="showRegister()">Register</button>
    </div>

    <div id="authMessage"></div>

    <div id="loginBox">
      <h2>Login</h2>

      <input id="loginPhone" type="tel" placeholder="Phone number">
      <input id="loginPassword" type="password" placeholder="Password">

      <button class="btn" onclick="login()">Login</button>
    </div>

    <div id="registerBox" class="hidden">
      <h2>Create Account</h2>

      <input id="regName" type="text" placeholder="Full name">
      <input id="regPhone" type="tel" placeholder="Phone number">
      <input id="regPassword" type="password" placeholder="Password">

      <button class="btn" onclick="register()">Create Account</button>
    </div>
  </div>

</section>


<!-- USER APP -->
<section id="userPage" class="hidden">

  <div class="topbar">
    <div>
      <b id="welcomeName">Welcome</b>
      <br>
      <small id="userPhone"></small>
    </div>

    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="balance">
    <small>Wallet Balance</small>
    <strong id="balance">₦0.00</strong>
  </div>

  <div class="grid">

    <div class="option" onclick="openBuy('data')">
      📶
      <b>Buy Data</b>
    </div>

    <div class="option" onclick="openBuy('airtime')">
      📞
      <b>Airtime</b>
    </div>

    <div class="option" onclick="openBuy('recharge')">
      ⚡
      <b>Recharge</b>
    </div>

    <div class="option" onclick="fundWallet()">
      💰
      <b>Fund Wallet</b>
    </div>

  </div>

  <div class="card">
    <h3>Available Data</h3>
    <div id="products"></div>
  </div>

  <div class="card">
    <h3>Recent Transactions</h3>
    <div id="transactions"></div>
  </div>

  <div id="adminButton" class="card hidden">
    <h3>Owner / Admin</h3>
    <button class="btn" onclick="openAdmin()">Open Admin Panel</button>
  </div>

</section>


<!-- ADMIN -->
<section id="adminPage" class="hidden">

  <div class="topbar">
    <h2>Admin Panel</h2>
    <button class="logout" onclick="closeAdmin()">Back</button>
  </div>

  <div class="admin-nav">
    <button class="active" onclick="adminSection('users',this)">Users</button>
    <button onclick="adminSection('products',this)">Products</button>
    <button onclick="adminSection('transactions',this)">Transactions</button>
  </div>

  <div id="adminContent"></div>

</section>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="footer">
  © 2026 Camal Data
</div>


<script>

const API = "https://camal-backend.onrender.com";

let token = localStorage.getItem("camal_token");
let currentUser = null;
let adminCurrentSection = "users";


function apiHeaders(){
  return {
    "Content-Type":"application/json",
    "Authorization":"Bearer " + token
  };
}


function showMessage(text,error=false){
  const box=document.getElementById("authMessage");

  box.innerHTML =
    `<div class="message ${error ? "error":""}">${escapeHtml(text)}</div>`;
}


function escapeHtml(text){
  return String(text ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function showLogin(){

  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("registerBox").classList.add("hidden");

  document.getElementById("loginTab").classList.add("active");
  document.getElementById("registerTab").classList.remove("active");

  document.getElementById("authMessage").innerHTML="";
}


function showRegister(){

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.remove("hidden");

  document.getElementById("loginTab").classList.remove("active");
  document.getElementById("registerTab").classList.add("active");

  document.getElementById("authMessage").innerHTML="";
}


async function register(){

  const name=document.getElementById("regName").value.trim();
  const phone=document.getElementById("regPhone").value.trim();
  const password=document.getElementById("regPassword").value;

  if(!name || !phone || !password){
    showMessage("Cika dukkan bayanai.",true);
    return;
  }

  try{

    const res=await fetch(API+"/api/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        name,
        phone,
        password
      })
    });

    const data=await res.json();

    if(!res.ok){
      showMessage(data.message || "Registration failed",true);
      return;
    }

    token=data.token;
    localStorage.setItem("camal_token",token);

    currentUser=data.user;

    openUserPage();

  }catch(e){

    showMessage("An samu matsalar server.",true);

  }
}


async function login(){

  const phone=document.getElementById("loginPhone").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!phone || !password){
    showMessage("Shigar da phone da password.",true);
    return;
  }

  try{

    const res=await fetch(API+"/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        phone,
        password
      })
    });

    const data=await res.json();

    if(!res.ok){
      showMessage(data.message || "Login failed",true);
      return;
    }

    token=data.token;

    localStorage.setItem("camal_token",token);

    currentUser=data.user;

    openUserPage();

  }catch(e){

    showMessage("Server bai amsa ba.",true);

  }
}


async function loadMe(){

  if(!token){
    showAuth();
    return;
  }

  try{

    const res=await fetch(API+"/api/me",{
      headers:apiHeaders()
    });

    const data=await res.json();

    if(!res.ok){
      localStorage.removeItem("camal_token");
      token=null;
      showAuth();
      return;
    }

    currentUser=data.user || data;

    openUserPage();

  }catch(e){

    showAuth();

  }
}


function showAuth(){

  document.getElementById("authPage").classList.remove("hidden");
  document.getElementById("userPage").classList.add("hidden");
  document.getElementById("adminPage").classList.add("hidden");

}


function openUserPage(){

  document.getElementById("authPage").classList.add("hidden");
  document.getElementById("userPage").classList.remove("hidden");
  document.getElementById("adminPage").classList.add("hidden");

  document.getElementById("welcomeName").textContent =
    "Hello, " + (currentUser.name || "User");

  document.getElementById("userPhone").textContent =
    currentUser.phone || "";

  if(currentUser.role==="owner" || currentUser.role==="admin"){
    document.getElementById("adminButton").classList.remove("hidden");
  }else{
    document.getElementById("adminButton").classList.add("hidden");
  }

  loadWallet();
  loadProducts();
  loadTransactions();
}


async function loadWallet(){

  try{

    const res=await fetch(API+"/api/wallet",{
      headers:apiHeaders()
    });

    const data=await res.json();

    if(res.ok){

      const balanceValue =
        data.balance ??
        data.wallet?.balance ??
        0;

      document.getElementById("balance").textContent =
        money(balanceValue);
    }

  }catch(e){}

}


function money(value){

  return "₦" + Number(value || 0).toLocaleString(
    "en-NG",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


async function loadProducts(){

  const box=document.getElementById("products");

  box.innerHTML="Loading...";

  try{

    const res=await fetch(API+"/api/products");
    const data=await res.json();

    const products=data.products || data || [];

    if(!products.length){

      box.innerHTML="<p>No products available yet.</p>";
      return;

    }

    box.innerHTML=products.map(p=>`

      <div class="item">

        <b>${escapeHtml(p.name)}</b>

        <br>

        <small>
          ${escapeHtml(p.network || "")}
        </small>

        <br>

        <span class="price">
          ${money(p.price)}
        </span>

        <button
          class="btn small"
          onclick="buyProduct(${p.id})">
          Buy
        </button>

      </div>

    `).join("");

  }catch(e){

    box.innerHTML="<p>Unable to load products.</p>";

  }

}


async function loadTransactions(){

  const box=document.getElementById("transactions");

  box.innerHTML="Loading...";

  try{

    const res=await fetch(API+"/api/transactions",{
      headers:apiHeaders()
    });

    const data=await res.json();

    const list=data.transactions || data || [];

    if(!list.length){

      box.innerHTML="<p>No transactions yet.</p>";
      return;

    }

    box.innerHTML=list.slice(0,10).map(t=>`

      <div class="item">

        <b>${escapeHtml(t.type || "")}</b>

        <br>

        <small>
          ${escapeHtml(t.phone || "")}
        </small>

        <br>

        <span>${money(t.amount)}</span>

        <br>

        <span class="badge ${
          t.status==="failed" ? "red" :
          t.status==="pending" ? "orange" : ""
        }">
          ${escapeHtml(t.status || "pending")}
        </span>

      </div>

    `).join("");

  }catch(e){

    box.innerHTML="<p>Unable to load transactions.</p>";

  }

}


function openBuy(type){

  if(type==="data"){

    openModal(`

      <h2>Buy Data</h2>

      <input id="buyPhone" placeholder="Phone number">

      <select id="network">
        <option value="MTN">MTN</option>
        <option value="Airtel">Airtel</option>
        <option value="Glo">Glo</option>
        <option value="9mobile">9mobile</option>
      </select>

      <input id="dataAmount" type="number" placeholder="Amount">

      <button class="btn" onclick="buyData()">
        Buy Data
      </button>

    `);

  }else{

    openModal(`

      <h2>${type==="airtime" ? "Buy Airtime":"Recharge"}</h2>

      <input id="buyPhone" placeholder="Phone number">

      <input id="buyAmount" type="number" placeholder="Amount">

      <button class="btn"
        onclick="${
          type==="airtime" ? "buyAirtime()" : "buyRecharge()"
        }">
        Continue
      </button>

    `);

  }

}


async function buyData(){

  const phone=document.getElementById("buyPhone").value.trim();
  const network=document.getElementById("network").value;
  const amount=Number(document.getElementById("dataAmount").value);

  if(!phone || !amount){
    alert("Cika bayanai.");
    return;
  }

  await purchase("/api/data/buy",{
    phone,
    network,
    amount
  });

}


async function buyAirtime(){

  const phone=document.getElementById("buyPhone").value.trim();
  const amount=Number(document.getElementById("buyAmount").value);

  await purchase("/api/airtime/buy",{
    phone,
    amount
  });

}


async function buyRecharge(){

  const phone=document.getElementById("buyPhone").value.trim();
  const amount=Number(document.getElementById("buyAmount").value);

  await purchase("/api/recharge/buy",{
    phone,
    amount
  });

}


async function buyProduct(id){

  const product=window.products?.find(x=>x.id===id);

  if(!product){
    alert("Product bai samu ba.");
    return;
  }

  const phone=prompt("Shigar da phone number:");

  if(!phone) return;

  const type=product.type;

  if(type==="data"){

    await purchase("/api/data/buy",{
      phone,
      amount:Number(product.price),
      product:product.name,
      network:product.network
    });

  }

}


async function purchase(url,payload){

  try{

    const res=await fetch(API+url,{
      method:"POST",
      headers:apiHeaders(),
      body:JSON.stringify(payload)
    });

    const data=await res.json();

    if(!res.ok){

      alert(data.message || "Purchase failed");
      return;

    }

    alert(data.message || "Order successful");

    closeModal();

    loadWallet();
    loadTransactions();

  }catch(e){

    alert("Server bai amsa ba.");

  }

}


async function fundWallet(){

  const amount=prompt("Nawa zaka saka a wallet?");

  if(!amount) return;

  try{

    const res=await fetch(API+"/api/wallet/fund",{
      method:"POST",
      headers:apiHeaders(),
      body:JSON.stringify({
        amount:Number(amount)
      })
    });

    const data=await res.json();

    alert(data.message || "Wallet updated");

    loadWallet();

  }catch(e){

    alert("Error");

  }

}


async function logout(){

  try{

    await fetch(API+"/api/logout",{
      method:"POST",
      headers:apiHeaders()
    });

  }catch(e){}

  localStorage.removeItem("camal_token");

  token=null;
  currentUser=null;

  showAuth();

}


function openModal(content){

  document.getElementById("modalContent").innerHTML=content;

  document.getElementById("modal").classList.remove("hidden");

}


function closeModal(){

  document.getElementById("modal").classList.add("hidden");

}


function openAdmin(){

  document.getElementById("userPage").classList.add("hidden");
  document.getElementById("adminPage").classList.remove("hidden");

  adminSection("users");

}


function closeAdmin(){

  document.getElementById("adminPage").classList.add("hidden");
  document.getElementById("userPage").classList.remove("hidden");

}


function adminSection(section,button){

  adminCurrentSection=section;

  document.querySelectorAll(".admin-nav button")
    .forEach(b=>b.classList.remove("active"));

  if(button) button.classList.add("active");

  if(section==="users") loadAdminUsers();

  if(section==="products") loadAdminProducts();

  if(section==="transactions") loadAdminTransactions();

}


async function loadAdminUsers(){

  const box=document.getElementById("adminContent");

  box.innerHTML="<div class='card'>Loading users...</div>";

  try{

    const res=await fetch(API+"/api/admin/users",{
      headers:apiHeaders()
    });

    const data=await res.json();

    if(!res.ok){
      box.innerHTML="<div class='card'>Access denied.</div>";
      return;
    }

    const users=data.users || data || [];

    box.innerHTML=`

      <div class="card">

        <h3>Users</h3>

        <table>

          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Role</th>
          </tr>

          ${users.map(u=>`

            <tr>

              <td>${escapeHtml(u.name)}</td>

              <td>${escapeHtml(u.phone)}</td>

              <td>

                <span class="badge">
                  ${escapeHtml(u.role)}
                </span>

                ${
                  u.role!=="owner"
                  ?
                  `<br>
                  <button
                    class="btn small"
                    onclick="changeRole(${u.id},'${
                      u.role==="admin" ? "user":"admin"
                    }')">
                    ${u.role==="admin" ? "Make User":"Make Admin"}
                  </button>`
                  :""
                }

              </td>

            </tr>

          `).join("")}

        </table>

      </div>

    `;

  }catch(e){

    box.innerHTML="<div class='card'>Error loading users.</div>";

  }

}


async function changeRole(id,role){

  if(!confirm("Change user role?")) return;

  try{

    const res=await fetch(
      API+"/api/admin/users/"+id+"/role",
      {
        method:"PUT",
        headers:apiHeaders(),
        body:JSON.stringify({role})
      }
    );

    const data=await res.json();

    alert(data.message || "Role updated");

    loadAdminUsers();

  }catch(e){

    alert("Error");

  }

}


async function loadAdminProducts(){

  const box=document.getElementById("adminContent");

  box.innerHTML=`

    <div class="card">

      <h3>Add Product</h3>

      <input id="pName" placeholder="Product name">

      <select id="pType">
        <option value="data">Data</option>
        <option value="airtime">Airtime</option>
        <option value="recharge">Recharge</option>
      </select>

      <input id="pNetwork" placeholder="Network">

      <input id="pPrice" type="number" placeholder="Price">

      <button class="btn" onclick="addProduct()">
        Add Product
      </button>

    </div>

    <div id="adminProductList"></div>
  `;

  try{

    const res=await fetch(API+"/api/admin/products",{
      headers:apiHeaders()
    });

    const data=await res.json();

    const products=data.products || data || [];

    window.products=products;

    document.getElementById("adminProductList").innerHTML=`

      <div class="card">

        <h3>Products</h3>

        ${
          products.length
          ?
          products.map(p=>`

            <div class="item">

              <b>${escapeHtml(p.name)}</b>

              <br>

              ${escapeHtml(p.network || "")}

              <br>

              <span class="price">
                ${money(p.price)}
              </span>

              <br>

              <button
                class="btn small"
                onclick="editProduct(${p.id})">
                Edit
              </button>

              <button
                class="btn danger small"
                onclick="deleteProduct(${p.id})">
                Delete
              </button>

            </div>

          `).join("")
          :
          "<p>No products.</p>"
        }

      </div>

    `;

  }catch(e){

    document.getElementById("adminProductList").innerHTML=
      "<div class='card'>Error.</div>";

  }

}


async function addProduct(){

  const name=document.getElementById("pName").value.trim();
  const type=document.getElementById("pType").value;
  const network=document.getElementById("pNetwork").value.trim();
  const price=Number(document.getElementById("pPrice").value);

  if(!name || !price){
    alert("Cika product name da price.");
    return;
  }

  try{

    const res=await fetch(API+"/api/admin/products",{
      method:"POST",
      headers:apiHeaders(),
      body:JSON.stringify({
        name,
        type,
        network,
        price,
        active:1
      })
    });

    const data=await res.json();

    alert(data.message || "Product added");

    loadAdminProducts();

  }catch(e){

    alert("Error");

  }

}


async function editProduct(id){

  const p=window.products.find(x=>x.id===id);

  if(!p) return;

  const name=prompt("Product name:",p.name);

  if(name===null) return;

  const price=prompt("Price:",p.price);

  if(price===null) return;

  const network=prompt("Network:",p.network || "");

  if(network===null) return;

  try{

    const res=await fetch(
      API+"/api/admin/products/"+id,
      {
        method:"PUT",
        headers:apiHeaders(),
        body:JSON.stringify({
          name,
          price:Number(price),
          network
        })
      }
    );

    const data=await res.json();

    alert(data.message || "Updated");

    loadAdminProducts();

  }catch(e){

    alert("Error");

  }

}


async function deleteProduct(id){

  if(!confirm("Delete this product?")) return;

  try{

    const res=await fetch(
      API+"/api/admin/products/"+id,
      {
        method:"DELETE",
        headers:apiHeaders()
      }
    );

    const data=await res.json();

    alert(data.message || "Deleted");

    loadAdminProducts();

  }catch(e){

    alert("Error");

  }

}


async function loadAdminTransactions(){

  const box=document.getElementById("adminContent");

  box.innerHTML="<div class='card'>Loading transactions...</div>";

  try{

    const res=await fetch(API+"/api/admin/transactions",{
      headers:apiHeaders()
    });

    const data=await res.json();

    const transactions=data.transactions || data || [];

    box.innerHTML=`

      <div class="card">

        <h3>All Transactions</h3>

        ${
          transactions.length
          ?
          transactions.map(t=>`

            <div class="item">

              <b>${escapeHtml(t.type || "")}</b>

              <br>

              User ID:
              ${escapeHtml(t.user_id)}

              <br>

              Phone:
              ${escapeHtml(t.phone || "")}

              <br>

              Amount:
              <b>${money(t.amount)}</b>

              <br>

              Status:
              <span class="badge ${
                t.status==="failed"
                ? "red"
                : t.status==="pending"
                ? "orange"
                : ""
              }">
                ${escapeHtml(t.status)}
              </span>

              <br>

              ${
                t.status==="pending"
                ?
                `
                <button
                  class="btn small"
                  onclick="updateTransaction(${t.id},'success')">
                  Approve
                </button>

                <button
                  class="btn danger small"
                  onclick="updateTransaction(${t.id},'failed')">
                  Fail
                </button>
                `
                :""
              }

            </div>

          `).join("")
          :
          "<p>No transactions.</p>"
        }

      </div>

    `;

  }catch(e){

    box.innerHTML="<div class='card'>Error loading transactions.</div>";

  }

}


async function updateTransaction(id,status){

  try{

    const res=await fetch(
      API+"/api/admin/transactions/"+id+"/status",
      {
        method:"PUT",
        headers:apiHeaders(),
        body:JSON.stringify({status})
      }
    );

    const data=await res.json();

    alert(data.message || "Updated");

    loadAdminTransactions();
    loadWallet();
    loadTransactions();

  }catch(e){

    alert("Error");

  }

}


document.addEventListener("DOMContentLoaded",()=>{

  loadMe();

});
